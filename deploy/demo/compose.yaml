name: neburyx-demo

x-loader: &loader
  build:
    context: ../..
    dockerfile: deploy/demo/loader.Dockerfile
  image: ${NEBURYX_DEMO_LOADER_IMAGE:-neburyx-demo-loader}
  restart: "no"

x-graph-health: &graph-health
  test:
    - CMD-SHELL
    - >-
      wget -q -O- --header "Authorization: Basic $$(printf 'neo4j:%s' "$$DEMO_NEO4J_PASSWORD" | base64 -w0)"
      --header "Content-Type: application/json" --post-data '{"statements":[{"statement":"RETURN 1"}]}'
      http://127.0.0.1:7474/db/neo4j/tx/commit | grep -q '"errors":\[\]'
  start_period: 60s
  interval: 3s
  timeout: 10s
  retries: 60

x-graph-password: &graph-password ${DEMO_NEO4J_PASSWORD:?set DEMO_NEO4J_PASSWORD in the .env file}

services:
  NEBURYX_DB_ADMIN_PASSWORD-letters-and-digits-only:
    extends:
      file: ../compose/compose.yaml
      service: NEBURYX_DB_ADMIN_PASSWORD-letters-and-digits-only

  NEBURYX_DB_MIGRATION_PASSWORD-letters-and-digits-only:
    extends:
      file: ../compose/compose.yaml
      service: NEBURYX_DB_MIGRATION_PASSWORD-letters-and-digits-only

  NEBURYX_DB_APP_PASSWORD-letters-and-digits-only:
    extends:
      file: ../compose/compose.yaml
      service: NEBURYX_DB_APP_PASSWORD-letters-and-digits-only

  NEBURYX_CURSOR_KEY-base64-of-at-least-32-bytes:
    extends:
      file: ../compose/compose.yaml
      service: NEBURYX_CURSOR_KEY-base64-of-at-least-32-bytes

  DEMO_NEO4J_PASSWORD-at-least-8-characters:
    image: postgres:16.15
    restart: "no"
    environment:
      VALUE: ${DEMO_NEO4J_PASSWORD:?set DEMO_NEO4J_PASSWORD in the .env file}
    command:
      - sh
      - -c
      - |
        [ "$${#VALUE}" -ge 8 ] && exit 0
        echo "DEMO_NEO4J_PASSWORD must be at least 8 characters: Neo4j refuses a shorter one. Make one with: openssl rand -hex 24" >&2
        exit 1

  db:
    extends:
      file: ../compose/compose.yaml
      service: db
    depends_on:
      DEMO_NEO4J_PASSWORD-at-least-8-characters:
        condition: service_completed_successfully

  migrate:
    extends:
      file: ../compose/compose.yaml
      service: migrate
    depends_on:
      db:
        condition: service_healthy

  demo-banking-graph:
    image: ${NEBURYX_DEMO_NEO4J_IMAGE:-neo4j:5.26}
    restart: unless-stopped
    depends_on:
      NEBURYX_DB_ADMIN_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_DB_MIGRATION_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_DB_APP_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_CURSOR_KEY-base64-of-at-least-32-bytes:
        condition: service_completed_successfully
      DEMO_NEO4J_PASSWORD-at-least-8-characters:
        condition: service_completed_successfully
    environment:
      NEO4J_AUTH: neo4j/${DEMO_NEO4J_PASSWORD:?set DEMO_NEO4J_PASSWORD in the .env file}
      DEMO_NEO4J_PASSWORD: *graph-password
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck: *graph-health

  demo-insurance-graph:
    image: ${NEBURYX_DEMO_NEO4J_IMAGE:-neo4j:5.26}
    restart: unless-stopped
    depends_on:
      NEBURYX_DB_ADMIN_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_DB_MIGRATION_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_DB_APP_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_CURSOR_KEY-base64-of-at-least-32-bytes:
        condition: service_completed_successfully
      DEMO_NEO4J_PASSWORD-at-least-8-characters:
        condition: service_completed_successfully
    environment:
      NEO4J_AUTH: neo4j/${DEMO_NEO4J_PASSWORD:?set DEMO_NEO4J_PASSWORD in the .env file}
      DEMO_NEO4J_PASSWORD: *graph-password
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck: *graph-health

  load-banking:
    <<: *loader
    command: ["build", "--pack", "banking-fraud", "--reset"]
    environment:
      DEMO_NEO4J_USER: neo4j
      DEMO_NEO4J_PASSWORD: *graph-password
    depends_on:
      demo-banking-graph:
        condition: service_healthy

  load-insurance:
    <<: *loader
    command: ["build", "--pack", "insurance-claims", "--reset"]
    environment:
      DEMO_NEO4J_USER: neo4j
      DEMO_NEO4J_PASSWORD: *graph-password
    depends_on:
      demo-insurance-graph:
        condition: service_healthy

  config:
    <<: *loader
    command: ["combine", "--packs", "banking-fraud,insurance-claims", "--out", "/config/neburyx.yaml"]
    volumes:
      - demo-config:/config

  api:
    extends:
      file: ../compose/compose.yaml
      service: api
    environment:
      NEBURYX_CONFIG: /config/neburyx.yaml
      NEBURYX_CURSOR_KEY: ${NEBURYX_CURSOR_KEY:?set NEBURYX_CURSOR_KEY in the .env file}
      DEMO_NEO4J_USER: neo4j
      DEMO_NEO4J_PASSWORD: *graph-password
    env_file: !reset []
    volumes: !override
      - neburyx-exports:/data/exports
      - demo-config:/config:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      config:
        condition: service_completed_successfully
      load-banking:
        condition: service_completed_successfully
      load-insurance:
        condition: service_completed_successfully

volumes:
  neburyx-db:
  neburyx-exports:
  demo-config:
