# The mapping file of the Community install. Copy this file to neburyx.yaml in this folder and add your sources.
# With no sources the API starts and lists none. See docs/install.md.
sources: []

# The AI preview is off. To switch it on, set NEBURYX_PROFILE=enterprise on the api and migrate services as well as
# ai.preview: true below, choose a model (there is no default model), and give the key by reference: the name of an
# environment variable (env), or the absolute path of a file that only its owner can read (file: /run/secrets/...).
# The key is never written in this file. See docs/ai-preview.md, "Switch the AI preview on".
# >>> ai preview example
# ai:
#   preview: true
#   provider: anthropic
#   model: claude-sonnet-5-5
#   key:
#     env: ANTHROPIC_API_KEY
#   effort: medium   # low, medium, high, xhigh or max
#   prompts:
#     ask.plan: /etc/neburyx/prompts/ask-plan.txt
# <<< ai preview example
