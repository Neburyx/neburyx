name: neburyx

services:
  NEBURYX_DB_ADMIN_PASSWORD-letters-and-digits-only:
    image: postgres:16.15
    restart: "no"
    environment:
      VALUE: ${NEBURYX_DB_ADMIN_PASSWORD:?set NEBURYX_DB_ADMIN_PASSWORD in the .env file}
    command:
      - sh
      - -c
      - |
        printf '%s' "$$VALUE" | grep -Eq '^[A-Za-z0-9]+$$' && exit 0
        echo "NEBURYX_DB_ADMIN_PASSWORD must be letters and digits only, because it is put into a connection string. Make one with: openssl rand -hex 24" >&2
        exit 1

  NEBURYX_DB_MIGRATION_PASSWORD-letters-and-digits-only:
    image: postgres:16.15
    restart: "no"
    environment:
      VALUE: ${NEBURYX_DB_MIGRATION_PASSWORD:?set NEBURYX_DB_MIGRATION_PASSWORD in the .env file}
    command:
      - sh
      - -c
      - |
        printf '%s' "$$VALUE" | grep -Eq '^[A-Za-z0-9]+$$' && exit 0
        echo "NEBURYX_DB_MIGRATION_PASSWORD must be letters and digits only, because it is put into a connection string. Make one with: openssl rand -hex 24" >&2
        exit 1

  NEBURYX_DB_APP_PASSWORD-letters-and-digits-only:
    image: postgres:16.15
    restart: "no"
    environment:
      VALUE: ${NEBURYX_DB_APP_PASSWORD:?set NEBURYX_DB_APP_PASSWORD in the .env file}
    command:
      - sh
      - -c
      - |
        printf '%s' "$$VALUE" | grep -Eq '^[A-Za-z0-9]+$$' && exit 0
        echo "NEBURYX_DB_APP_PASSWORD must be letters and digits only, because it is put into a connection string. Make one with: openssl rand -hex 24" >&2
        exit 1

  NEBURYX_CURSOR_KEY-base64-of-at-least-32-bytes:
    image: postgres:16.15
    restart: "no"
    environment:
      VALUE: ${NEBURYX_CURSOR_KEY:?set NEBURYX_CURSOR_KEY in the .env file}
    command:
      - sh
      - -c
      - |
        stripped=$$(printf '%s' "$$VALUE" | sed 's/=*$$//')
        printf '%s' "$$VALUE" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$$' && [ "$${#stripped}" -ge 43 ] && exit 0
        echo "NEBURYX_CURSOR_KEY must be base64 text of at least 32 random bytes. Make one with: openssl rand -base64 32" >&2
        exit 1

  db:
    image: postgres:16.15
    restart: unless-stopped
    depends_on:
      NEBURYX_DB_ADMIN_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_DB_MIGRATION_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_DB_APP_PASSWORD-letters-and-digits-only:
        condition: service_completed_successfully
      NEBURYX_CURSOR_KEY-base64-of-at-least-32-bytes:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: ${NEBURYX_DB_ADMIN_PASSWORD:?set NEBURYX_DB_ADMIN_PASSWORD in the .env file}
      NEBURYX_DB_MIGRATION_PASSWORD: ${NEBURYX_DB_MIGRATION_PASSWORD:?set NEBURYX_DB_MIGRATION_PASSWORD in the .env file}
      NEBURYX_DB_APP_PASSWORD: ${NEBURYX_DB_APP_PASSWORD:?set NEBURYX_DB_APP_PASSWORD in the .env file}
    volumes:
      - neburyx-db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ${NEBURYX_IMAGE:-neburyx}:${NEBURYX_TAG:-latest}
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: postgres://neburyx_migrate:${NEBURYX_DB_MIGRATION_PASSWORD:?set NEBURYX_DB_MIGRATION_PASSWORD in the .env file}@db:5432/neburyx
      DATABASE_APP_ROLE: neburyx_app
      NEBURYX_PROFILE: ${NEBURYX_PROFILE:-}
      NEBURYX_CONFIG: /etc/neburyx/neburyx.yaml
      NEBURYX_DATABASE_CONNECT_TIMEOUT_MS: ${NEBURYX_DATABASE_CONNECT_TIMEOUT_MS:-}
    volumes:
      - ${NEBURYX_CONFIG_DIR:-./config}:/etc/neburyx:ro

  api:
    image: ${NEBURYX_IMAGE:-neburyx}:${NEBURYX_TAG:-latest}
    command: ["api"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://neburyx_app:${NEBURYX_DB_APP_PASSWORD:?set NEBURYX_DB_APP_PASSWORD in the .env file}@db:5432/neburyx
      NEBURYX_CURSOR_KEY: ${NEBURYX_CURSOR_KEY:?set NEBURYX_CURSOR_KEY in the .env file}
      NEBURYX_CONFIG: /etc/neburyx/neburyx.yaml
      NEBURYX_PROFILE: ${NEBURYX_PROFILE:-}
      NEBURYX_AI_CACHE: ${NEBURYX_AI_CACHE:-}
      NEBURYX_AI_CACHE_TTL: ${NEBURYX_AI_CACHE_TTL:-}
      NEBURYX_DATABASE_CONNECT_TIMEOUT_MS: ${NEBURYX_DATABASE_CONNECT_TIMEOUT_MS:-}
      NEBURYX_READINESS_LIMIT_MS: ${NEBURYX_READINESS_LIMIT_MS:-}
    env_file:
      - path: ./source.env
        required: false
    volumes:
      - neburyx-exports:/data/exports
      - ${NEBURYX_CONFIG_DIR:-./config}:/etc/neburyx:ro
    ports:
      - "127.0.0.1:${NEBURYX_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 10s

volumes:
  neburyx-db:
  neburyx-exports:
