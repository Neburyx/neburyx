# The demo question set: what an investigator types (entities already replaced by placeholders),
# and the plan Ask is expected to return, or that it must refuse. Run by tools/ask-eval.
questions:
  - id: accounts-on-the-same-device
    pack: banking-fraud
    wording: Which accounts use the same device as ‹account#1›?
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: account, stableId: ‹account#1› }, attributeType: device, via: USES_DEVICE } }
  - id: accounts-on-the-same-address
    pack: banking-fraud
    wording: Which accounts connect from the same address as ‹account#1›?
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: account, stableId: ‹account#1› }, attributeType: ip_address, via: CONNECTS_FROM } }
  - id: same-device-in-a-window
    pack: banking-fraud
    wording: Which accounts used the same device as ‹account#1› in the last 90 days?
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: account, stableId: ‹account#1› }, attributeType: device, via: USES_DEVICE, window: { days: 90 } } }
  - id: at-least-two-shared-devices
    pack: banking-fraud
    wording: Which accounts share at least 2 devices with ‹account#1›?
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: account, stableId: ‹account#1› }, attributeType: device, via: USES_DEVICE, minShared: 2 } }
  - id: ten-accounts-on-the-same-address
    pack: banking-fraud
    wording: Show 10 accounts that use the same address as ‹account#1›.
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: account, stableId: ‹account#1› }, attributeType: ip_address, via: CONNECTS_FROM, limit: 10 } }
  - id: claimants-at-the-same-address
    pack: insurance-claims
    wording: Which claimants live at the same address as ‹claimant#1›?
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: claimant, stableId: ‹claimant#1› }, attributeType: address, via: LIVES_AT } }
  - id: claimants-sharing-a-phone
    pack: insurance-claims
    wording: Which claimants share a phone with ‹claimant#1›?
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: claimant, stableId: ‹claimant#1› }, attributeType: phone, via: REACHED_AT } }
  - id: claims-on-the-same-vehicle
    pack: insurance-claims
    wording: Which claims involve the same vehicle as ‹claim#1›?
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: claim, stableId: ‹claim#1› }, attributeType: vehicle, via: INVOLVES_VEHICLE } }
  - id: claims-by-the-same-repairer
    pack: insurance-claims
    wording: Which other claims did the same repairer repair as ‹claim#1›?
    expect: { kind: plan, template: shared-attribute, params: { ref: { entityType: claim, stableId: ‹claim#1› }, attributeType: repairer, via: REPAIRED_BY } }
  - id: accounts-paid-by-an-account
    pack: banking-fraud
    wording: Which accounts has ‹account#1› transferred money to?
    expect: { kind: plan, template: linked-entities, params: { ref: { entityType: account, stableId: ‹account#1› }, targetType: account, via: [TRANSFERRED_TO], direction: out } }
  - id: accounts-that-paid-an-account
    pack: banking-fraud
    wording: Which accounts sent money to ‹account#1›?
    expect: { kind: plan, template: linked-entities, params: { ref: { entityType: account, stableId: ‹account#1› }, targetType: account, via: [TRANSFERRED_TO], direction: in } }
  - id: accounts-within-two-transfers
    pack: banking-fraud
    wording: Which accounts are connected to ‹account#1› by transfers within 2 steps?
    expect: { kind: plan, template: linked-entities, params: { ref: { entityType: account, stableId: ‹account#1› }, targetType: account, via: [TRANSFERRED_TO], direction: both, maxHops: 2 } }
  - id: merchants-an-account-paid
    pack: banking-fraud
    wording: Which merchants has ‹account#1› paid?
    expect: { kind: plan, template: linked-entities, params: { ref: { entityType: account, stableId: ‹account#1› }, targetType: merchant, via: [INITIATED, PAID_TO], direction: out, maxHops: 2 } }
  - id: merchants-paid-in-a-window
    pack: banking-fraud
    wording: Which merchants did ‹account#1› pay in the last 30 days?
    expect: { kind: plan, template: linked-entities, params: { ref: { entityType: account, stableId: ‹account#1› }, targetType: merchant, via: [INITIATED, PAID_TO], direction: out, maxHops: 2, window: { days: 30 } } }
  - id: claims-filed-by-a-claimant
    pack: insurance-claims
    wording: Which claims were filed by ‹claimant#1›?
    expect: { kind: plan, template: linked-entities, params: { ref: { entityType: claimant, stableId: ‹claimant#1› }, targetType: claim, via: [FILED_BY] } }
  - id: policies-of-a-claimants-claims
    pack: insurance-claims
    wording: Which policies are the claims of ‹claimant#1› under?
    expect: { kind: plan, template: linked-entities, params: { ref: { entityType: claimant, stableId: ‹claimant#1› }, targetType: policy, via: [FILED_BY, UNDER_POLICY], direction: both, maxHops: 2 } }
  - id: show-an-account
    pack: banking-fraud
    wording: Show me ‹account#1›.
    expect: { kind: plan, template: entity, params: { ref: { entityType: account, stableId: ‹account#1› } } }
  - id: devices-and-addresses-of-an-account
    pack: banking-fraud
    wording: How many devices and addresses is ‹account#1› connected to?
    expect: { kind: plan, template: degree-preview, params: { ref: { entityType: account, stableId: ‹account#1› } } }
  - id: accounts-using-a-device
    pack: banking-fraud
    wording: Which accounts use ‹device#1›?
    expect: { kind: plan, template: expand, params: { ref: { entityType: device, stableId: ‹device#1› }, relTypes: [USES_DEVICE], neighborTypes: [account], direction: in, limit: 25 } }
  - id: latest-transactions-of-an-account
    pack: banking-fraud
    wording: Show the latest transactions of ‹account#1›.
    expect: { kind: plan, template: expand, params: { ref: { entityType: account, stableId: ‹account#1› }, relTypes: [INITIATED], neighborTypes: [transaction], direction: out, sort: observed, limit: 25 } }
  - id: payments-made-to-a-merchant
    pack: banking-fraud
    wording: Show the payments made to ‹merchant#1›.
    expect: { kind: plan, template: expand, params: { ref: { entityType: merchant, stableId: ‹merchant#1› }, relTypes: [PAID_TO], neighborTypes: [transaction], direction: in, limit: 25 } }
  - id: devices-used-in-a-window
    pack: banking-fraud
    wording: Which devices did ‹account#1› use in the last 7 days?
    expect: { kind: plan, template: expand, params: { ref: { entityType: account, stableId: ‹account#1› }, relTypes: [USES_DEVICE], neighborTypes: [device], direction: out, window: { days: 7 } } }
  - id: shared-device-chain
    pack: banking-fraud
    wording: Which accounts are linked to ‹account#1› by a shared device, and what chain shows it?
    expect: { kind: plan, template: derived-rule-run, params: { ref: { entityType: account, stableId: ‹account#1› }, ruleId: shared-device } }
  - id: why-two-accounts-are-linked
    pack: banking-fraud
    wording: Why are ‹account#1› and ‹account#2› linked through a shared device?
    expect: { kind: plan, template: derived-edge-support, params: { ruleId: shared-device, ends: [{ entityType: account, stableId: ‹account#1› }, { entityType: account, stableId: ‹account#2› }] } }
  - id: transactions-with-a-payment-reference
    pack: banking-fraud
    wording: Which transactions have the payment reference ‹value#1›?
    expect: { kind: plan, template: search, params: { entityTypes: [transaction], text: ‹value#1› } }
  - id: shortest-path-between-accounts
    pack: banking-fraud
    wording: What is the shortest path between ‹account#1› and ‹account#2›?
    expect: { kind: unsupported }
  - id: accounts-related-to-an-account
    pack: banking-fraud
    wording: Which accounts are related to ‹account#1›?
    expect: { kind: unsupported }
  - id: accounts-sharing-two-kinds-of-attribute
    pack: banking-fraud
    wording: Which accounts share both a device and an address with ‹account#1›?
    expect: { kind: unsupported }
  - id: accounts-opened-last-month
    pack: banking-fraud
    wording: Which accounts were opened last month?
    expect: { kind: unsupported }
  - id: duplicate-addresses
    pack: insurance-claims
    wording: Which addresses are duplicates of ‹address#1›?
    expect: { kind: unsupported }
  - id: is-an-account-fraudulent
    pack: banking-fraud
    wording: Is ‹account#1› fraudulent?
    expect: { kind: unsupported }
  - id: accounts-on-screen
    pack: banking-fraud
    wording: How many accounts are on screen?
    expect: { kind: unsupported }
  - id: claimant-with-the-most-claims
    pack: insurance-claims
    wording: Which of these claimants has the most claims?
    expect: { kind: unsupported }
