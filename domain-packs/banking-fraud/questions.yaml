# The demo questions of this pack as a person types them, with what Ask should find: the intent and its inputs, or refuse.
questions:
  - id: accounts-on-the-same-device
    wording: "Which accounts use the same device as AC-0002000?"
    expect: { intent: accounts-on-the-same-device, entities: {"account": "AC-0002000"} }
  - id: accounts-on-the-same-address
    wording: "Which accounts connect from the same address as AC-0002000?"
    expect: { intent: accounts-on-the-same-address, entities: {"account": "AC-0002000"} }
  - id: same-device-in-a-window
    wording: "Which accounts used the same device as AC-0002000 in the last 90 days?"
    expect: { intent: same-device-in-the-last-90-days, entities: {"account": "AC-0002000"} }
  - id: at-least-two-shared-devices
    wording: "Which accounts share at least 2 devices with AC-0002000?"
    expect: { intent: two-shared-devices, entities: {"account": "AC-0002000"} }
  - id: ten-accounts-on-the-same-address
    wording: "Show 10 accounts that use the same address as AC-0002000."
    expect: { intent: ten-accounts-on-the-same-address, entities: {"account": "AC-0002000"} }
  - id: accounts-paid-by-an-account
    wording: "Which accounts has AC-0002000 transferred money to?"
    expect: { intent: accounts-paid-by-an-account, entities: {"account": "AC-0002000"} }
  - id: accounts-that-paid-an-account
    wording: "Which accounts sent money to AC-0002001?"
    expect: { intent: accounts-that-paid-an-account, entities: {"account": "AC-0002001"} }
  - id: accounts-within-two-transfers
    wording: "Which accounts are connected to AC-0002000 by transfers within 2 steps?"
    expect: { intent: accounts-within-two-transfers, entities: {"account": "AC-0002000"} }
  - id: merchants-an-account-paid
    wording: "Which merchants has AC-0002000 paid?"
    expect: { intent: merchants-an-account-paid, entities: {"account": "AC-0002000"} }
  - id: merchants-paid-in-a-window
    wording: "Which merchants did AC-0002000 pay in the last 30 days?"
    expect: { intent: merchants-paid-in-the-last-30-days, entities: {"account": "AC-0002000"} }
  - id: show-an-account
    wording: "Show me AC-0002000."
    expect: { intent: show-an-account, entities: {"account": "AC-0002000"} }
  - id: devices-and-addresses-of-an-account
    wording: "How many devices and addresses is AC-0002000 connected to?"
    expect: { intent: devices-and-addresses-of-an-account, entities: {"account": "AC-0002000"} }
  - id: accounts-using-a-device
    wording: "Which accounts use DV-000010?"
    expect: { intent: accounts-using-a-device, entities: {"device": "DV-000010"} }
  - id: latest-transactions-of-an-account
    wording: "Show the latest transactions of AC-0002000."
    expect: { intent: latest-transactions-of-an-account, entities: {"account": "AC-0002000"} }
  - id: payments-made-to-a-merchant
    wording: "Show the payments made to MR-0100."
    expect: { intent: payments-made-to-a-merchant, entities: {"merchant": "MR-0100"} }
  - id: devices-used-in-a-window
    wording: "Which devices did AC-0002000 use in the last 7 days?"
    expect: { intent: devices-used-in-the-last-7-days, entities: {"account": "AC-0002000"} }
  - id: shared-device-chain
    wording: "Which accounts are linked to AC-0002000 by a shared device, and what chain shows it?"
    expect: { intent: shared-device-chain, entities: {"account": "AC-0002000"} }
  - id: why-two-accounts-are-linked
    wording: "Why are AC-0002000 and AC-0002001 linked through a shared device?"
    expect: { intent: why-two-accounts-are-linked, entities: {"first": "AC-0002000", "second": "AC-0002001"} }
  - id: transactions-with-a-payment-reference
    wording: "Which transactions have the payment reference PR-00000010?"
    expect: { intent: transactions-with-a-payment-reference, entities: {"reference": "PR-00000010"} }
  - id: shortest-path-between-accounts
    wording: "What is the shortest path between AC-0002000 and AC-0002003?"
    expect: refuse
  - id: accounts-related-to-an-account
    wording: "Which accounts are related to AC-0002000?"
    expect: refuse
  - id: accounts-sharing-two-kinds-of-attribute
    wording: "Which accounts share both a device and an address with AC-0002000?"
    expect: refuse
  - id: accounts-opened-last-month
    wording: "Which accounts were opened last month?"
    expect: refuse
  - id: is-an-account-fraudulent
    wording: "Is AC-0002000 fraudulent?"
    expect: refuse
  - id: accounts-on-screen
    wording: "How many accounts are on screen?"
    expect: refuse
  - id: customers-with-a-name
    wording: "Who is the customer named Ada Alder?"
    expect: { intent: customers-by-name, entities: {"name": "Ada Alder"} }
