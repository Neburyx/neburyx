# When "it" could mean elements of more than one earlier turn and nothing says which, the router asks for a clarification and never picks one; a message that names which element it means expects an answer.
# The labelled messages of the assistant for this pack: what a person types, with the route the router should choose (view, with the names of types when it also asks what they mean; meaning, with the names of the types it asks about; ask with its intent and inputs; or refuse with its cause). One message for every intent of the pack's Ask folder.
messages:
  - id: describe-the-view
    wording: "What is shown here, claimants and claims?"
    expect: { route: view, view: [{ entityType: claimant, stableId: CT-00100 }, { entityType: claim, stableId: CL-001007 }] }
  - id: summarize-what-is-on-screen
    wording: "Summarize the claims on screen for me."
    expect: { route: view, view: [{ entityType: claim, stableId: CL-001007 }, { entityType: claim, stableId: CL-001008 }] }
  - id: claimants-at-the-same-address
    wording: "Which claimants live at the same address as CT-00100?"
    expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00100 } }
  - id: claimants-sharing-a-phone
    wording: "Which claimants share a phone with CT-00100?"
    expect: { route: ask, intent: claimants-sharing-a-phone, entities: { claimant: CT-00100 } }
  - id: claims-on-the-same-vehicle
    wording: "Which claims involve the same vehicle as CL-001007?"
    expect: { route: ask, intent: claims-on-the-same-vehicle, entities: { claim: CL-001007 } }
  - id: claims-by-the-same-repairer
    wording: "Which other claims did the same repairer repair as CL-001007?"
    expect: { route: ask, intent: claims-by-the-same-repairer, entities: { claim: CL-001007 } }
  - id: claims-filed-by-a-claimant
    wording: "Which claims were filed by CT-00100?"
    expect: { route: ask, intent: claims-filed-by-a-claimant, entities: { claimant: CT-00100 } }
  - id: policies-of-a-claimants-claims
    wording: "Which policies are the claims of CT-00100 under?"
    expect: { route: ask, intent: policies-of-a-claimants-claims, entities: { claimant: CT-00100 } }
  - id: claimants-by-name
    wording: "Who is the claimant named Ada Alder?"
    expect: { route: ask, intent: claimants-by-name, entities: { name: Ada Alder } }
  - id: verdict-on-a-claimant
    wording: "Is claimant CT-00100 a fraudster?"
    expect: { route: refuse, cause: verdict }
  - id: verdict-on-a-repairer
    wording: "Did the repairer commit fraud on CL-001007?"
    expect: { route: refuse, cause: verdict }
  - id: raw-query-match
    wording: "MATCH (c:Claim) RETURN c LIMIT 25"
    expect: { route: refuse, cause: raw-query }
  - id: raw-query-sql
    wording: "Execute: SELECT * FROM claims WHERE amount > 10000"
    expect: { route: refuse, cause: raw-query }
  - id: other-source-banking
    wording: "Look at the banking accounts source instead and list the devices."
    expect: { route: refuse, cause: other-source }
  - id: other-source-transactions
    wording: "Show the transactions graph of the other database."
    expect: { route: refuse, cause: other-source }
  - id: unplaced-the-large-ones
    wording: "Do something with the large ones."
    expect: { route: refuse, cause: unplaced }
  - id: unplaced-tidy-it
    wording: "Tidy it up a little."
    expect: { route: refuse, cause: unplaced }

# Short threads: each turn is labelled with its route and, for a plan, its intent and inputs; a follow-up names no entity and is resolved from the turns before it.
  - id: what-is-a-claim
    wording: "What is a claim?"
    expect: { route: meaning, types: [claim] }
  - id: what-does-a-policy-mean
    wording: "What does a policy mean in this data?"
    expect: { route: meaning, types: [policy] }
  - id: what-do-the-links-mean
    wording: "What do FILED_BY and UNDER_POLICY stand for?"
    expect: { route: meaning, types: [FILED_BY, UNDER_POLICY] }
  - id: what-is-shown-and-what-is-a-claimant
    wording: "What is shown here, and what is a claimant?"
    expect: { route: view, view: [{ entityType: claimant, stableId: CT-00100 }, { entityType: claim, stableId: CL-001007 }], types: [claimant] }
  - id: saved-ai-notes
    wording: "What do my saved AI notes say about the claimants and claims on screen?"
    expect: { route: view, view: [{ entityType: claimant, stableId: CT-00100 }, { entityType: claim, stableId: CL-001007 }] }
  - id: ai-summary-of-the-view
    wording: "Draft an AI summary of what is on screen."
    expect: { route: view, view: [{ entityType: claim, stableId: CL-001007 }, { entityType: claim, stableId: CL-001008 }] }
  - id: typology-list
    wording: "Which shapes of money movement does the typology list?"
    expect: { route: view, view: [{ entityType: claimant, stableId: CT-00100 }, { entityType: claim, stableId: CL-001007 }] }
  - id: another-persons-notes
    wording: "What did my colleague write in their AI notes on this investigation?"
    expect: { route: refuse, cause: other-source }
  - id: write-a-note
    wording: "Write a note on this claim for me."
    expect: { route: refuse, cause: unplaced }
  - id: summary-word-in-a-question
    wording: "In summary, which claimants live at the same address as CT-00100?"
    expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00100 } }

threads:
  - id: address-then-phone
    turns:
      - message: "Which claimants live at the same address as CT-00200?"
        expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00200 } }
      - message: "And which claimants share a phone with them?"
        expect: { route: ask, intent: claimants-sharing-a-phone, entities: { claimant: CT-00200 } }
  - id: filed-then-policies
    turns:
      - message: "Which claims were filed by CT-00210?"
        expect: { route: ask, intent: claims-filed-by-a-claimant, entities: { claimant: CT-00210 } }
      - message: "Which policies do their claims sit on?"
        expect: { route: ask, intent: policies-of-a-claimants-claims, entities: { claimant: CT-00210 } }
  - id: vehicle-then-repairer
    turns:
      - message: "Which claims involve the same vehicle as CL-002020?"
        expect: { route: ask, intent: claims-on-the-same-vehicle, entities: { claim: CL-002020 } }
      - message: "Which claims went through the same repairer?"
        expect: { route: ask, intent: claims-by-the-same-repairer, entities: { claim: CL-002020 } }
  - id: two-claimants-then-who
    turns:
      - message: "Which claims were filed by CT-00230?"
        expect: { route: ask, intent: claims-filed-by-a-claimant, entities: { claimant: CT-00230 } }
      - message: "Which claims were filed by CT-00231?"
        expect: { route: ask, intent: claims-filed-by-a-claimant, entities: { claimant: CT-00231 } }
      - message: "Who lives at the same address as that claimant?"
        expect: { route: clarify, intent: claimants-at-the-same-address, role: claimant, entities: {}, candidates: [{ entityType: claimant, stableId: CT-00230 }, { entityType: claimant, stableId: CT-00231 }] }
  - id: two-claims-then-repairer
    turns:
      - message: "Which claims involve the same vehicle as CL-002040?"
        expect: { route: ask, intent: claims-on-the-same-vehicle, entities: { claim: CL-002040 } }
      - message: "Which claims involve the same vehicle as CL-002041?"
        expect: { route: ask, intent: claims-on-the-same-vehicle, entities: { claim: CL-002041 } }
      - message: "Which claims went through the same repairer as that one?"
        expect: { route: clarify, intent: claims-by-the-same-repairer, role: claim, entities: {}, candidates: [{ entityType: claim, stableId: CL-002040 }, { entityType: claim, stableId: CL-002041 }] }
  - id: verdict-in-the-middle
    turns:
      - message: "Which claims were filed by CT-00250?"
        expect: { route: ask, intent: claims-filed-by-a-claimant, entities: { claimant: CT-00250 } }
      - message: "So is this claimant lying?"
        expect: { route: refuse, cause: verdict }
      - message: "Which claimants share a phone with them?"
        expect: { route: ask, intent: claimants-sharing-a-phone, entities: { claimant: CT-00250 } }
  - id: raw-query-in-the-middle
    turns:
      - message: "Which claims involve the same vehicle as CL-002060?"
        expect: { route: ask, intent: claims-on-the-same-vehicle, entities: { claim: CL-002060 } }
      - message: "MATCH (c:Claim)-[:ON]->(v:Vehicle) RETURN v LIMIT 5"
        expect: { route: refuse, cause: raw-query }
      - message: "Which claims went through the same repairer?"
        expect: { route: ask, intent: claims-by-the-same-repairer, entities: { claim: CL-002060 } }
  - id: five-turns-it-is-ambiguous
    turns:
      - message: "Which claimants live at the same address as CT-00270?"
        expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00270 } }
      - message: "Which claimants live at the same address as CT-00271?"
        expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00271 } }
      - message: "Which claimants live at the same address as CT-00272?"
        expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00272 } }
      - message: "Who shares a phone with them?"
        expect: { route: clarify, intent: claimants-sharing-a-phone, role: claimant, entities: {}, candidates: [{ entityType: claimant, stableId: CT-00270 }, { entityType: claimant, stableId: CT-00271 }, { entityType: claimant, stableId: CT-00272 }] }
      - message: "And which policies do their claims sit on?"
        expect: { route: clarify, intent: policies-of-a-claimants-claims, role: claimant, entities: {}, candidates: [{ entityType: claimant, stableId: CT-00270 }, { entityType: claimant, stableId: CT-00271 }, { entityType: claimant, stableId: CT-00272 }] }
  - id: five-turns-the-last-one-named
    turns:
      - message: "Which claimants live at the same address as CT-00270?"
        expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00270 } }
      - message: "Which claimants live at the same address as CT-00271?"
        expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00271 } }
      - message: "Which claimants live at the same address as CT-00272?"
        expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00272 } }
      - message: "Who shares a phone with the last claimant I asked about?"
        expect: { route: ask, intent: claimants-sharing-a-phone, entities: { claimant: CT-00272 } }
      - message: "And which policies do the claims of that last claimant sit on?"
        expect: { route: ask, intent: policies-of-a-claimants-claims, entities: { claimant: CT-00272 } }
  - id: other-source-in-the-middle
    turns:
      - message: "Which claimants share a phone with CT-00280?"
        expect: { route: ask, intent: claimants-sharing-a-phone, entities: { claimant: CT-00280 } }
      - message: "Pull the same from the banking accounts source."
        expect: { route: refuse, cause: other-source }
      - message: "Back here: who shares an address with them?"
        expect: { route: ask, intent: claimants-at-the-same-address, entities: { claimant: CT-00280 } }
  - id: view-then-a-claimant
    turns:
      - message: "What is on screen right now?"
        expect: { route: view, view: [{ entityType: claim, stableId: CL-002090 }, { entityType: claimant, stableId: CT-00290 }] }
      - message: "Show me the claims filed by CT-00290."
        expect: { route: ask, intent: claims-filed-by-a-claimant, entities: { claimant: CT-00290 } }
      - message: "And their policies?"
        expect: { route: ask, intent: policies-of-a-claimants-claims, entities: { claimant: CT-00290 } }
