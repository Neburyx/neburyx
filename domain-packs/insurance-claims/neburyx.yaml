sources:
  - id: insurance-demo
    uri: "bolt://demo-insurance-graph:7687"
    database: neo4j
    auth: { kind: basic, username_env: DEMO_NEO4J_USER, password_env: DEMO_NEO4J_PASSWORD }
    synthetic: true
    vocabulary: { case_ref: "Claim no." }

    entities:
      - type: claim
        label: Claim
        description: "A request to the insurer for payment after a loss, with a date and a status."
        stable_id: claimNumber
        title: "Claim {claimNumber}"
        search: [claimNumber]
        filterable: [status, lossType]
        link: "https://records.example.test/claims/{claimNumber}"
        display: { icon: folder, key_properties: [lossType, status, filedOn], state_property: status }
      - type: policy
        label: Policy
        description: "The insurance contract under which a claim is made."
        stable_id: policyNumber
        title: "Policy {policyNumber}"
        search: [policyNumber]
        filterable: [cover]
        display: { icon: shield, key_properties: [cover, startedOn] }
      - type: claimant
        label: Claimant
        description: "A person who makes a claim."
        stable_id: claimantId
        title: "{fullName}"
        search: [claimantId, fullName]
        pii: [{ property: fullName, class: name }, { property: dateOfBirth, class: date }]
        display: { icon: person }
      - type: vehicle
        label: Vehicle
        description: "A vehicle that is named in a claim."
        stable_id: vin
        search: [vin]
        filterable: [make]
        display: { icon: car, key_properties: [make, model, year] }
      - type: repairer
        label: Repairer
        description: "A business that repairs vehicles."
        stable_id: repairerId
        title: "{name}"
        search: [repairerId, name]
        display: { icon: wrench }
      - type: address
        label: Address
        description: "A street address recorded for a person."
        stable_id: addressId
        search: [addressId, line1]
        display: { icon: house, key_properties: [line1, city] }
      - type: phone
        label: Phone
        description: "A phone number recorded for a person."
        stable_id: number
        search: [number]
        pii: [{ property: owner, class: name }]
        display: { icon: telephone }

    relationships:
      - type: UNDER_POLICY
        from: claim
        to: policy
        description: "The claim is made under the policy."
      - type: FILED_BY
        from: claim
        to: claimant
        description: "The claim was filed by the claimant."
        stable_id: eventId
        observed_at: filedAt
        evidence: [sourceRecordId]
        filterable: [channel]
        evidence_link: "https://records.example.test/events/{sourceRecordId}"
      - type: INVOLVES_VEHICLE
        from: claim
        to: vehicle
        description: "The claim names the vehicle."
      - type: REPAIRED_BY
        from: claim
        to: repairer
        description: "The vehicle was repaired by the repairer."
      - type: LIVES_AT
        from: claimant
        to: address
        description: "The claimant has the address recorded."
      - type: REACHED_AT
        from: claimant
        to: phone
        description: "The claimant has the phone number recorded."

    derived:
      - id: shared-phone
        from: claimant
        to: claimant
        via: [REACHED_AT, phone, REACHED_AT]
        rule_version: 1
        stop_list_property: isShared

    patterns:
      - id: shared-addresses
        name: "Shared addresses"
        template: shared-attribute
        bind: { anchor: claimant, attribute: address, via: LIVES_AT }
        labels: { anchor: "Starting claimant", limit: "Max matching claimants" }
      - id: claimant-claims
        name: "Claims by claimant"
        template: linked-entities
        bind: { anchor: claimant, target: claim, via: FILED_BY }
        labels: { anchor: "Starting claimant", limit: "Max claims" }
    style_rules:
      - id: claim-under-review
        label: Claim under review
        applies_to: claim
        when: { property: status, op: eq, value: review }
        effect: { badge: amber }
      - id: denied-claim
        label: Denied claim
        applies_to: claim
        when: { property: status, op: eq, value: denied }
        effect: { color: red }
