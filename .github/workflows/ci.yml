name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Every job names its runner image. `ubuntu-latest` moved from 24.04 to 26.04 and with it Docker (28.0.4 to 29.4.2) and
# Compose (v2.38.2 to v5.1.3) changed under the compose tests; move the image on purpose. The Docker jobs print the
# Docker versions first, so a change shows in the log.

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract

  integration:
    runs-on: ubuntu-26.04
    steps:
      - run: |
          docker version
          docker compose version
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - run: |
          docker version
          docker compose version
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - run: pnpm test:image
      - run: docker buildx build --platform linux/amd64,linux/arm64 -f deploy/docker/Dockerfile --output type=oci,dest=${{ runner.temp }}/neburyx.oci.tar .
      - run: node deploy/docker/check-platforms.mjs ${{ runner.temp }}/neburyx.oci.tar

  compose:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - run: |
          docker version
          docker compose version
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compose

  ux:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @neburyx/web build:ux
      - run: pnpm --filter @neburyx/renderer-spike build:node
      - run: pnpm --filter @neburyx/ux-tests check:profile
      # The cache key names the Playwright version in package.json of tools/ux; change both together.
      - uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-${{ runner.os }}
      - run: pnpm --filter @neburyx/ux-tests exec playwright install --with-deps chromium
      - run: pnpm test:ux
