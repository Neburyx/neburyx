name: Ask evaluation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ask-eval --packs domain-packs --replay tools/ask-eval/data/replay.json --baseline tools/ask-eval/data/baseline.json
      - if: always()
        run: pnpm ask-eval assistant --packs domain-packs --replay tools/ask-eval/data/assistant/scripted/replay.json
      - if: always()
        run: pnpm ask-eval assistant --packs domain-packs --replay tools/ask-eval/data/assistant/claude-sonnet-5-5/replay.json --baseline tools/ask-eval/data/assistant/claude-sonnet-5-5/baseline.json
      - if: always()
        run: pnpm ask-eval assistant --packs domain-packs --replay tools/ask-eval/data/assistant/claude-haiku-5-5/replay.json --baseline tools/ask-eval/data/assistant/claude-haiku-5-5/baseline.json
