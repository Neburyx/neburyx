name: Ask evaluation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ask-eval --questions services/api/tests/ask/questions.yaml --replay services/api/tests/ask/replies.json --packs domain-packs --baseline services/api/tests/ask/baseline.json --mode replay
